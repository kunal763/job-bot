[project]
name = "job-bot"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.1",
    "email-validator>=2.3.0",
    "google-genai>=2.25.0",
    "groq>=1.7.0",
    "playwright>=1.63.0",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "python-dotenv>=1.2.3",
    "rich>=15.0.0",
    "secretstorage>=3.5.0",
    "typer>=0.27.2",
]

[project.scripts]
job-bot = "job_bot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_bot"]
